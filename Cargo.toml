[package]
name = "contextwindowarchitecture-assembler"
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
description = "A Rust assembler for the Context Window Architecture (CWA) draft specification"
license = "Apache-2.0"
repository = "https://github.com/contextwindowarchitecture/assembler-rust"
homepage = "https://contextwindowarchitecture.io"
readme = "README.md"
keywords = ["llm", "context-window", "prompt", "cwa"]
categories = ["text-processing"]
# The published crate carries the source and the vendored files it embeds, with their license and the lock that
# names the spec commit. The conformance cases stay out: only the tests and examples read them, and neither ships.
include = [
    "src/**",
    "vendor/cwa.lock.json",
    "vendor/cwa/LICENSE",
    "vendor/cwa/NOTICE",
    "vendor/cwa/contract/**",
    "vendor/cwa/schema/**",
    "vendor/cwa/conformance/README.md",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "NOTICE",
]

[lib]
name = "contextwindowarchitecture_assembler"

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-gencat"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[dev-dependencies]

# The conformance runner and the adapter for scripts/conformance.py are examples, so `cargo install` never installs
# them; the adapter's own tests run with the suite.
[[example]]
name = "adapter"
test = true
